name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
      - name: Setup check (toolchain + sample puzzle end to end)
        run: ./setup-check.sh
      - name: Full test suite
        run: ./run-tests.sh
